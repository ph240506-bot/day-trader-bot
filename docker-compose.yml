# 24/7 on a Raspberry Pi, old laptop or Oracle Cloud Always Free VM.
# Don't edit this. Run:  bash scripts/pi_setup.sh
# It asks for your keys, writes .env, starts freellmapi, grabs its key and starts the bot.
# Both containers restart themselves after crashes, power cuts and reboots.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }   # keeps logs from filling the SD card

services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    restart: unless-stopped
    environment:
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:?run scripts/pi_setup.sh first}
      # Only set during setup (loads your provider keys); keys then live encrypted in the volume.
      FREEAPI_CONFIG_JSON: ${FREEAPI_CONFIG_JSON:-}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - freellmapi-data:/app/server/data
    logging: *logging

  bot:
    build: .
    restart: unless-stopped
    depends_on: [freellmapi]
    env_file: .env
    environment:
      LLM_BASE_URL: http://freellmapi:3001/v1
      TZ: Australia/Melbourne              # log timestamps in your time
      MAX_RUNTIME_MINUTES: "5000000"      # effectively forever
      WAIT_FOR_OPEN_MINUTES: "5000000"    # never exit just because the market is shut
    volumes:
      - ./journal:/app/journal
    logging: *logging

  smallcap:
    # Small-cap catalyst mode, on its own Alpaca paper account. Turned on by COMPOSE_PROFILES=smallcap in .env.
    build: .
    command: ["python", "-m", "bot.smallcap.main"]
    profiles: ["smallcap"]
    restart: unless-stopped
    depends_on: [freellmapi]
    env_file: .env
    environment:
      LLM_BASE_URL: http://freellmapi:3001/v1
      TZ: Australia/Melbourne
    volumes:
      - ./journal:/app/journal
    logging: *logging

  opend:
    # moomoo's OpenD gateway: live whole-market prices for the small-cap bot. Intel-only program, so it runs
    # under emulation on the Pi. Turned on by adding "moomoo" to COMPOSE_PROFILES (scripts/moomoo_setup.sh).
    build:
      context: docker/opend
      args:
        OPEND_URL: ${MOOMOO_OPEND_URL:-}
    platform: linux/amd64
    profiles: ["moomoo"]
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      MOOMOO_LOGIN: ${MOOMOO_LOGIN:-}
      MOOMOO_PASSWORD_MD5: ${MOOMOO_PASSWORD_MD5:-}
    volumes:
      - ./opend-data:/root          # keeps the "trusted device" login so it doesn't ask for a code every restart
    logging: *logging

volumes:
  freellmapi-data:
